<div id="img-size-control">
  🖼️ Image Size:
  <input type="range" id="img-scale-slider" min="10" max="100" step="5" value="90" />
  <span id="img-scale-value">90%</span>
</div>

<script>
(function () {
  const STORAGE_KEY = "imgScale";
  const DEFAULT     = 90;

  const slider     = document.getElementById("img-scale-slider");
  const valueLabel = document.getElementById("img-scale-value");

  function applyScale(value) {
    document.documentElement.style.setProperty("--img-scale", value + "%");
    valueLabel.textContent = value + "%";
  }

  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    slider.value = saved;
    applyScale(saved);
  } else {
    applyScale(DEFAULT);
  }

  slider.addEventListener("input", function () {
    applyScale(this.value);
    localStorage.setItem(STORAGE_KEY, this.value);
  });
})();
</script>
